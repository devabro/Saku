name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/flutter-sdk
          key: flutter-sdk-stable-3.47.7

      - name: Download Flutter SDK
        if: steps.cache-flutter.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git ~/flutter-sdk

      - name: Add Flutter to PATH
        run: echo "$HOME/flutter-sdk/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Gradle wrapper jar
        run: |
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p android/gradle/wrapper
          echo "Downloading fresh wrapper jar..."
          curl -L -o "$JAR" "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar"
          ls -lh "$JAR"
          unzip -l "$JAR" | grep -q "GradleWrapperMain.class" && echo "Wrapper jar OK" || (echo "Wrapper jar INVALID" && exit 1)

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Saku-universal.apk

      - name: Release APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: universal-${{ github.run_number }}
          name: "Saku universal #${{ github.run_number }}"
          body: "Satu APK untuk semua HP Android 7+ (termasuk Redmi Note 7 Pro): berisi arm, arm64, dan x64. Uninstall versi debug lama dulu bila install gagal."
          prerelease: false
          files: build/app/outputs/flutter-apk/Saku-universal.apk
