name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Cache Flutter SDK
        id: cache-flutter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/flutter-sdk
          key: flutter-sdk-stable-3.47.7

      - name: Download Flutter SDK
        if: steps.cache-flutter.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git ~/flutter-sdk

      - name: Add Flutter to PATH
        run: echo "$HOME/flutter-sdk/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure Gradle wrapper jar
        run: |
          JAR="android/gradle/wrapper/gradle-wrapper.jar"
          mkdir -p android/gradle/wrapper
          curl -L -o "$JAR" "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar"
          unzip -l "$JAR" | grep -q "GradleWrapperMain.class" || exit 1

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Release APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: debug-${{ github.run_number }}
          name: "Saku debug #${{ github.run_number }}"
          prerelease: true
          files: build/app/outputs/flutter-apk/app-*.apk
